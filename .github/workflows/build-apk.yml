name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name gateio_smc_pro

      - name: Add Android Internet permission
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"

      - name: Fix generated widget test
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:gateio_smc_pro/main.dart';

          void main() {
            testWidgets('GateIO SMC app loads', (WidgetTester tester) async {
              await tester.pumpWidget(const GateSmcApp());

              expect(find.byType(GateSmcApp), findsOneWidget);
              expect(find.text('Gate.io SMC PRO'), findsOneWidget);
            });
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart code
        run: dart format lib test

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gateio-smc-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
